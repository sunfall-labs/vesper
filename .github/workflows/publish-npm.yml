name: Publish npm packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - next
          - latest
      dry-run:
        description: Run npm publish --dry-run only
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  RELEASE_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist-tag || (contains(github.ref_name, '-alpha') && 'alpha' || contains(github.ref_name, '-beta') && 'beta' || contains(github.ref_name, '-rc') && 'next' || 'latest') }}
  RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.7.5
          node-version: 24
          cache-dependency-path: nub.lock
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Verify
        run: nub run verify

      - name: Publish preflight
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_version="${GITHUB_REF_NAME#v}"
            for package_dir in packages/*; do
              package_version="$(nub pkg --dir "$package_dir" get version)"
              if [ "$package_version" != "$expected_version" ]; then
                echo "::error file=$package_dir/package.json::Tag v$expected_version does not match package version $package_version."
                exit 1
              fi
            done
          fi
          if [ "$DRY_RUN" != "true" ]; then
            case "$GITHUB_REF" in
              refs/heads/main | refs/tags/v*) ;;
              *)
                echo "::error::Real npm publishes must run from refs/heads/main or refs/tags/v*, not $GITHUB_REF."
                exit 1
                ;;
            esac
          fi
        env:
          DRY_RUN: ${{ env.RELEASE_DRY_RUN }}

      - name: Publish
        run: |
          set -euo pipefail
          args=(
            --filter '@sunfall/vesper-*'
            --access public
            --tag "$DIST_TAG"
          )
          # Native Nub's provenance flow is only needed for a real upload;
          # this also keeps dry-runs usable without an OIDC probe.
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run --no-git-checks)
          else
            args+=(--provenance)
            # GitHub checks out pushed tags detached. The ref preflight above
            # still gates real releases; this only permits Nub to publish them.
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              args+=(--no-git-checks)
            fi
          fi
          nub publish "${args[@]}"
        env:
          DIST_TAG: ${{ env.RELEASE_DIST_TAG }}
          DRY_RUN: ${{ env.RELEASE_DRY_RUN }}
