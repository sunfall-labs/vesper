name: Publish npm packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - next
          - latest
      dry-run:
        description: Run npm publish --dry-run only
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  RELEASE_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist-tag || (contains(github.ref_name, '-alpha') && 'alpha' || contains(github.ref_name, '-beta') && 'beta' || contains(github.ref_name, '-rc') && 'next' || 'latest') }}
  RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Check publish readiness
        run: bun run check:publish-ready

      - name: Audit packed production dependencies
        run: bun run audit:packed-consumer

      - name: Publish preflight
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_version="${GITHUB_REF_NAME#v}"
            for package_dir in packages/*; do
              package_version="$(jq -r .version "$package_dir/package.json")"
              if [ "$package_version" != "$expected_version" ]; then
                echo "::error file=$package_dir/package.json::Tag v$expected_version does not match package version $package_version."
                exit 1
              fi
            done
          fi
          if [ "$DRY_RUN" != "true" ]; then
            case "$GITHUB_REF" in
              refs/heads/main | refs/tags/v*) ;;
              *)
                echo "::error::Real npm publishes must run from refs/heads/main or refs/tags/v*, not $GITHUB_REF."
                exit 1
                ;;
            esac
          fi
        env:
          DRY_RUN: ${{ env.RELEASE_DRY_RUN }}

      - name: Publish
        run: |
          set -euo pipefail
          args=(--tag "$DIST_TAG")
          # Provenance is only needed for a real upload; this also keeps
          # dry-runs usable without an OIDC probe.
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--provenance)
          fi
          bun scripts/publish-packages.mjs "${args[@]}"
        env:
          DIST_TAG: ${{ env.RELEASE_DIST_TAG }}
          DRY_RUN: ${{ env.RELEASE_DRY_RUN }}
