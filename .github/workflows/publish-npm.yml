name: Publish npm packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - next
          - latest
      dry-run:
        description: Run npm publish --dry-run only
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  RELEASE_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist-tag || (contains(github.ref_name, '-alpha') && 'alpha' || contains(github.ref_name, '-beta') && 'beta' || contains(github.ref_name, '-rc') && 'next' || 'latest') }}
  RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.12.1

      # The version comes from devDependencies so the bootstrap nub and the
      # pinned one are the same by construction; a bump is one edit, not two.
      - name: Setup nub
        run: |
          set -euo pipefail
          npm install -g "@nubjs/nub@$(node -p "require('./package.json').devDependencies['@nubjs/nub']")"
          nub --version

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Verify
        run: nub run verify

      - name: Publish preflight
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ]; then
            case "$GITHUB_REF" in
              refs/heads/main | refs/tags/v*) ;;
              *)
                echo "::error::Real npm publishes must run from refs/heads/main or refs/tags/v*, not $GITHUB_REF."
                exit 1
                ;;
            esac
          fi
        env:
          DRY_RUN: ${{ env.RELEASE_DRY_RUN }}

      - name: Publish
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            nub run publish:npm -- --tag "$DIST_TAG" --dry-run
          else
            nub run publish:npm -- --tag "$DIST_TAG"
          fi
        env:
          DIST_TAG: ${{ env.RELEASE_DIST_TAG }}
          DRY_RUN: ${{ env.RELEASE_DRY_RUN }}
