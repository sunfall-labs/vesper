name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: nub verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.7.5
          node-version: ${{ matrix.node }}
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Verify
        run: nub run verify

  postgres:
    name: Postgres integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.7.5
          node-version: 22
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile

      # Skipped by default in `nub run test` because they need a container
      # runtime. They are the only thing that proves the Postgres backend
      # queries the schema it documents, so they run here rather than nowhere.
      - name: Run the Postgres suite
        run: nub run test
        env:
          RUN_POSTGRES_INTEGRATION: '1'
