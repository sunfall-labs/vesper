name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  postgres:
    name: Postgres integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Skipped by default in `pnpm test` because they need a container
      # runtime. They are the only thing that proves the Postgres backend
      # queries the schema it documents, so they run here rather than nowhere.
      - name: Run the Postgres suite
        run: pnpm test
        env:
          RUN_POSTGRES_INTEGRATION: '1'
