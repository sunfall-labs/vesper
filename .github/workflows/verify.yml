name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: nub verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      # The version comes from devDependencies so the bootstrap nub and the
      # pinned one are the same by construction; a bump is one edit, not two.
      - name: Setup nub
        run: |
          set -euo pipefail
          npm install -g "@nubjs/nub@$(node -p "require('./package.json').devDependencies['@nubjs/nub']")"
          nub --version

      - name: Cache the nub store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.local/share/nub/store
          key: nub-store-${{ runner.os }}-${{ hashFiles('nub.lock') }}
          restore-keys: nub-store-${{ runner.os }}-

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Verify
        run: nub run verify

  postgres:
    name: Postgres integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup nub
        run: |
          set -euo pipefail
          npm install -g "@nubjs/nub@$(node -p "require('./package.json').devDependencies['@nubjs/nub']")"
          nub --version

      - name: Cache the nub store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.local/share/nub/store
          key: nub-store-${{ runner.os }}-${{ hashFiles('nub.lock') }}
          restore-keys: nub-store-${{ runner.os }}-

      - name: Install dependencies
        run: nub install --frozen-lockfile

      # Skipped by default in `nub run test` because they need a container
      # runtime. They are the only thing that proves the Postgres backend
      # queries the schema it documents, so they run here rather than nowhere.
      - name: Run the Postgres suite
        run: nub run test
        env:
          RUN_POSTGRES_INTEGRATION: '1'
