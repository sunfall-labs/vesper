# Nub reads this file — packages, overrides, allowBuilds, and the rest — only
# while the project does not claim a package-manager identity in
# `package.json`. Adding `packageManager: nub@x` or a `devEngines.packageManager`
# named `nub` flips it into "nub identity", where this file is ignored, the
# workspace collapses to the root package, and `nub install` rewrites
# `pnpm-lock.yaml` with every importer and every override dropped — with no
# error. The version pin therefore lives in `devDependencies`, not in
# `packageManager`. See `docs/contributing.md`.
packages:
  - 'packages/*'
  - 'examples/*'
  - 'benchmarks'

# `@nubjs/nub`'s postinstall only sets the execute bit on the platform binary
# and refreshes `~/.nub/shims`; the launcher does the same chmod at run time
# when it is skipped. Declared `false` rather than left undecided so a clean
# install has nothing to review.
allowBuilds:
  '@nubjs/nub': false
  '@google/genai': set this to true or false
  cpu-features: set this to true or false
  msgpackr-extract: set this to true or false
  protobufjs: set this to true or false
  ssh2: set this to true or false

# esbuild unpacks a prebuilt binary; Vite and Vitest do not start without it.
# Everything else here is an optional native addon reached through the Pi
# packages' transitive tree, and none of it is on any path this repository
# exercises — skipping the builds keeps node-gyp off a fresh clone.
onlyBuiltDependencies:
  - esbuild

# One copy of `effect`, and one copy of each Pi package. Effect services are
# compared by reference, so two resolutions of the same version make a `Layer`
# built in one tree fail to satisfy a requirement declared in the other — and
# the error points at the call site rather than at the duplication.
#
# `pi-agent-core@X` requires `pi-ai@^X`. A mismatch resolves two copies of
# `pi-ai` and breaks type identity exactly at the provider seam, which is the
# one place this repository cannot afford it.
overrides:
  '@earendil-works/pi-agent-core': 0.80.2
  '@earendil-works/pi-ai': 0.80.2
  '@effect/platform-node>@effect/platform-node-shared': 4.0.0-beta.103
  effect: 4.0.0-beta.103

# Those optional native addons are genuinely unused here, so an unbuilt one is
# the intended state rather than a warning to act on.
strictDepBuilds: false
